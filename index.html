<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b2a6b" />
    <meta name="description" content="Turcau Baseball League — jeu de baseball arcade familial." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Turcau Baseball League</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0f1a3d;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font: 900 32px "Arial Black", "Segoe UI Black", Impact, sans-serif;
        letter-spacing: 2px;
        text-shadow: 3px 3px 0 #000;
      }
    </style>
  </head>
  <body>
    <div id="loading">TURCAU BASEBALL LEAGUE…</div>
    <script>
      // Montre les erreurs à l'écran : utile sur une télé, où on ne peut pas ouvrir la console.
      (function () {
        function show(msg) {
          var el = document.getElementById('loading');
          if (!el) {
            el = document.createElement('div');
            el.id = 'loading';
            document.body.appendChild(el);
          }
          el.style.fontSize = '20px';
          el.style.padding = '40px';
          el.style.textAlign = 'center';
          el.style.whiteSpace = 'pre-wrap';
          el.textContent = 'Erreur de chargement :\n' + msg + '\n\n' + navigator.userAgent;
        }
        // seulement pendant le chargement : après le démarrage, le jeu continue même si une erreur arrive
        window.addEventListener('error', function (e) {
          if (document.getElementById('loading')) show((e && e.message) || String(e));
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (document.getElementById('loading')) show(String(e && e.reason));
        });
        // si rien ne démarre après 15 secondes, on le dit
        setTimeout(function () {
          if (document.getElementById('loading') && !document.querySelector('canvas')) show('le jeu ne démarre pas (délai dépassé)');
        }, 15000);
      })();
    </script>
    <div id="game"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
