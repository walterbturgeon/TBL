<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b2a6b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Turcau BBL" />
    <meta name="description" content="Turcau Olympic — baseball, volleyball et danse : jeux arcade pour la famille." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Turcau Olympic</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0f1a3d;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0f1a3d;
        color: #fff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        font: 900 26px "Arial Black", "Segoe UI Black", Impact, sans-serif;
        text-shadow: 3px 3px 0 #000;
        padding: 24px;
      }
      #rotate .phone {
        width: 70px;
        height: 120px;
        border: 6px solid #ffd23f;
        border-radius: 14px;
        margin-bottom: 28px;
        animation: turn 1.6s ease-in-out infinite;
      }
      @keyframes turn {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: flex; }
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font: 900 32px "Arial Black", "Segoe UI Black", Impact, sans-serif;
        letter-spacing: 2px;
        text-shadow: 3px 3px 0 #000;
      }
    </style>
  </head>
  <body>
    <div id="loading">TURCAU OLYMPIC…</div>
    <script>
      // Montre les erreurs à l'écran : utile sur une télé, où on ne peut pas ouvrir la console.
      (function () {
        function show(msg) {
          var el = document.getElementById('loading');
          if (!el) {
            el = document.createElement('div');
            el.id = 'loading';
            document.body.appendChild(el);
          }
          el.style.fontSize = '20px';
          el.style.padding = '40px';
          el.style.textAlign = 'center';
          el.style.whiteSpace = 'pre-wrap';
          el.textContent = 'Erreur de chargement :\n' + msg + '\n\n' + navigator.userAgent;
        }
        // seulement pendant le chargement : après le démarrage, le jeu continue même si une erreur arrive
        window.addEventListener('error', function (e) {
          if (document.getElementById('loading')) show((e && e.message) || String(e));
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (document.getElementById('loading')) show(String(e && e.reason));
        });
        // si rien ne démarre après 15 secondes, on le dit
        setTimeout(function () {
          if (document.getElementById('loading') && !document.querySelector('canvas')) show('le jeu ne démarre pas (délai dépassé)');
        }, 15000);
      })();
    </script>
    <div id="rotate"><div class="phone"></div>Tourne ton téléphone à l'horizontale pour jouer</div>
    <div id="game"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
